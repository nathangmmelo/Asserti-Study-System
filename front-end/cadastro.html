<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8fe">
  <title>Criar conta | ASSERTI</title>
  <link rel="stylesheet" href="/css/styles.css">
<script src="/js/acesso.js" defer></script>
</head>
<body class="pagina-acesso">
  <!-- header -->
  <main class="area-acesso">
    <section class="cartao-acesso" aria-labelledby="titulo-cadastro">
      <p class="sobretitulo">SEU CAMINHO COMEÇA AQUI</p>
      <h1 id="titulo-cadastro">Criar conta</h1>
      <p class="texto-acesso">Preencha seus dados para começar.</p>

      <p class="aviso-demonstracao" id="aviso-cadastro" role="status"></p>

      <form method="post" class="formulario-acesso" aria-describedby="aviso-cadastro" autocomplete="off">
        <div class="campo-acesso">
          <label for="nome">Nome completo</label>
          <input name="nome" id="nome" type="text" autocomplete="off" placeholder="Digite seu nome completo" required>
        </div>
        <div class="campo-acesso">
          <label for="email">E-mail</label>
          <input name="email" id="email" type="email" autocomplete="off" inputmode="email" placeholder="voce@exemplo.com" required>
        </div>
        <div class="campo-acesso">
          <label for="senha">Senha</label>
          <input name="senha" id="senha" type="password" autocomplete="new-password" minlength="8" placeholder="Pelo menos 8 caracteres" required>
        </div>
        <div class="campo-acesso">
          <label for="confirmar-senha">Confirmar senha</label>
          <input name="confirmar-senha" id="confirmar-senha" type="password" autocomplete="new-password" placeholder="Digite a senha novamente" required>
        </div>
        <button class="botao botao-formulario" type="submit">Criar conta</button>
      </form>

      <p class="alternativa-acesso">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </section>
  </main>
  <!-- footer -->
</body>
</html>
