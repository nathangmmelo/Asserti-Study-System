<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{titulo}} | ASSERTI</title><link rel="stylesheet" href="/css/styles.css"></head>
<body><!-- header -->
<main class="pagina-aula" id="conteudo">
  <nav class="trilha-aula" aria-label="Você está em"><a href="/#catalogo">Materiais</a> / <a href="/#{{categoria}}">{{tema}}</a></nav>
  <article>
    <header class="cabecalho-aula"><p class="sobretitulo">{{formato}}</p><h1>{{titulo}}</h1></header>
    <section class="cartao-aula"><h2>Material da aula</h2><p class="texto-aula">{{conteudo}}</p>{{fonte}}</section>
    <section class="convite-perguntas"><h2>Atividade da aula</h2><p>Depois de estudar o material, responda às perguntas. Cada acerto vale 10 pontos.</p>
      {{atividade}}</section>
  </article>
</main><!-- footer --></body></html>
